name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub release for the current version'
        type: boolean
        default: false

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 4-core runner with 16 GB of RAM; the Android plugin does not need more.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.parallel=true

jobs:
  test:
    # Every push to main: the same local gate, no release assets.
    if: github.ref_type == 'branch' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: tools/install-android-sdk.sh
      - run: ./tools/verify

  apk:
    # Tags publish a GitHub release; a manual dispatch builds the same APK without publishing.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: tools/install-android-sdk.sh
      - name: Resolve version
        id: version
        run: |
          name=$(sed -n 's/^val appVersionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          test -n "$name" || { echo "::error::cannot read versionName"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
      - name: Tag must match versionName
        if: github.ref_type == 'tag'
        run: |
          test "${{ steps.version.outputs.tag }}" = "$GITHUB_REF_NAME" ||
            { echo "::error::tag $GITHUB_REF_NAME does not match versionName ${{ steps.version.outputs.name }}"; exit 1; }
      - name: Restore the release signing key
        # Every published APK must keep the signing identity of the earlier releases, otherwise an
        # update fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
        env:
          KEYSTORE_B64: ${{ secrets.LUXCTRL_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" ||
            { echo "::error::secret LUXCTRL_KEYSTORE_B64 is missing"; exit 1; }
          mkdir -p "$RUNNER_TEMP/android"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/android/debug.keystore"
      - name: Build, test and lint
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Assert the APK keeps the release signature
        run: |
          set -euo pipefail
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1 || true)
          test -n "$apksigner" || { echo "::error::apksigner not found"; exit 1; }
          apk=app/build/outputs/apk/release/lux-ctrl-${{ steps.version.outputs.name }}.apk
          test -f "$apk" || { echo "::error::$apk missing"; exit 1; }
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          grep -qi "certificate SHA-256 digest: cde2781a239ab2b876e06f66b2654196979ba3f1d619dbb660a8d32601df1988" \
            "$RUNNER_TEMP/certs.txt" ||
            { echo "::error::APK is not signed with the Lux Ctrl release key"; exit 1; }
      - name: Assert the APK reports the repository version
        run: |
          set -euo pipefail
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1 || true)
          test -n "$aapt2" || { echo "::error::aapt2 not found"; exit 1; }
          "$aapt2" dump badging app/build/outputs/apk/release/lux-ctrl-${{ steps.version.outputs.name }}.apk |
            grep -q "versionName='${{ steps.version.outputs.name }}' " ||
            { echo "::error::APK does not report versionName ${{ steps.version.outputs.name }}"; exit 1; }
      - name: Package release asset and notes
        run: |
          set -euo pipefail
          name=${{ steps.version.outputs.name }}
          tag=${{ steps.version.outputs.tag }}
          mkdir -p dist
          cp "app/build/outputs/apk/release/lux-ctrl-$name.apk" "dist/lux-ctrl-$name.apk"
          (cd dist && sha256sum "lux-ctrl-$name.apk" > "lux-ctrl-$name.apk.sha256")
          digest=$(cut -d' ' -f1 "dist/lux-ctrl-$name.apk.sha256")
          {
            printf '<p align="center"><img src="https://raw.githubusercontent.com/%s/%s/docs/screenshot-portrait.png" alt="Lux Ctrl on a phone: segmented reactor controls above luminous Hue scene tiles" width="300"></p>\n\n' "$GITHUB_REPOSITORY" "$tag"
            printf 'A local instrument for Philips Hue: an orbital console for lamps, brightness, color and scenes. No accounts, cloud calls, analytics, ads or third-party runtime libraries.\n\n'
            printf '## Download\n\n'
            printf '[`lux-ctrl-%s.apk`](https://github.com/%s/releases/download/%s/lux-ctrl-%s.apk) — signed release build, upgrades in place. SHA-256: `%s`\n' "$name" "$GITHUB_REPOSITORY" "$tag" "$name" "$digest"
            printf '\nAndroid 7.0+ on a trusted local network; the Hue bridge is reached over its local v1 HTTP API.\n'
          } > dist/notes.md
          cat dist/notes.md
      - name: Upload preview artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: lux-ctrl-preview-apk
          path: dist/*
          retention-days: 14
      - name: Publish release
        if: github.ref_type == 'tag' || inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          name: Lux Ctrl ${{ steps.version.outputs.name }}
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: dist/notes.md
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: |
            dist/*.apk
            dist/*.sha256
